version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: fire_postgres
    environment:
      POSTGRES_USER: fireuser
      POSTGRES_PASSWORD: firepass
      POSTGRES_DB: firedetection
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireuser -d firedetection"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fire_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fire_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: fire_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://fireuser:firepass@postgres:5432/firedetection
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_VIDEOS: videos
      MINIO_BUCKET_RESULTS: results
      REDIS_URL: redis://redis:6379
      MODEL_PATH: /app/models/best.pt
      SECRET_KEY: supersecretkey123
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: fire_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://fireuser:firepass@postgres:5432/firedetection
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_VIDEOS: videos
      MINIO_BUCKET_RESULTS: results
      REDIS_URL: redis://redis:6379
      MODEL_PATH: /app/models/best.pt
    volumes:
      - ./backend:/app
      - ./backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: fire_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data: